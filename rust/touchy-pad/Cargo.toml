[package]
name = "touchy-pad"
description = "Host-side API for the Touchy-Pad open-source USB multitouch pad / button-matrix device."
readme = "../README.md"
# The prost bindings in `src/proto/touchy.rs` are checked in (regenerated by
# the `proto-gen` workspace member), so consumers need no build script, no
# `protoc` and no `prost-build`. `proto/*.proto` are symlinks to the shared
# schemas — kept so the crate documents its own wire format — and `tests/**`
# ship so the packaged crate stays testable (`cargo package` also stops
# warning about the excluded tests).
# tests/** ships so the packaged crate stays testable; examples/** ships because
# they are the primary "how am I meant to use this" surface (compiled by
# `cargo test` / `clippy --all-targets`, so they cannot rot).
include = ["src/**", "proto/*.proto", "tests/**", "examples/**"]
keywords = ["touchpad", "streamdeck", "lvgl", "esp32", "usb"]
categories = ["hardware-support", "api-bindings"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
prost.workspace = true
nusb.workspace = true
tokio.workspace = true
thiserror.workspace = true
log.workspace = true
bytes.workspace = true
image.workspace = true
futures.workspace = true
async-trait.workspace = true
tokio-serial = { version = "5.4", optional = true }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
base64 = "0.22"

[features]
# Off by default: pulls in tokio-serial (and its libudev/serialport
# transitive deps on Linux). Enable for the serial-port transport.
serial = ["dep:tokio-serial"]

# docs.rs builds with no features by default, which would hide the optional
# `serial` transport from the rendered API — and therefore from anyone (human or
# agent) retrieving these docs. Everything it needs is in docs.rs's build image.
[package.metadata.docs.rs]
features = ["serial"]

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
env_logger.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "sync", "io-util", "net"] }
