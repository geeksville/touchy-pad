name: Build firmware (reusable)

# Reusable workflow that builds firmware for every supported board and uploads
# each one as `firmware-<board>` containing a single flashable `<board>.bin`
# (bootloader + partition-table + app merged via esptool).
#
# Called from both `.github/workflows/app-ci.yml` (PR/push CI) and
# `.github/workflows/release.yml` (release asset publishing). Centralising
# the matrix here keeps the two callers in sync — adding a board, bumping
# the IDF version, or fixing the merge command only happens once.

on:
  workflow_call:
    outputs:
      idf-version:
        description: "ESP-IDF version used to build firmware."
        value: ${{ jobs.install-esp-idf.outputs.idf-version }}

# Least privilege: this workflow only reads the repo (plus the Actions cache)
# and uploads artifacts within the calling run.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # install-esp-idf: clone + install the ESP-IDF toolchain once and save it to
  # the Actions cache.  All parallel build-firmware matrix cells depend on this
  # job completing first so they get a guaranteed cache hit and skip the heavy
  # install step entirely.
  # ---------------------------------------------------------------------------
  install-esp-idf:
    runs-on: ubuntu-latest
    env:
      IDF_VERSION: "v6.0.1"
    outputs:
      idf-version: ${{ env.IDF_VERSION }}
    steps:
      - name: Cache ESP-IDF toolchain
        id: cache-idf
        uses: actions/cache@v5
        with:
          path: |
            ~/.espressif
            ~/esp/esp-idf
          # The `-v2` suffix is a cache *schema* version: bump it whenever the
          # cached layout changes or when a poisoned cache has to be dropped
          # (e.g. a venv that is missing a package idf.py needs — see the
          # verify/repair step below). v2 = the repair step that validates
          # `idf.py --version` instead of trusting `export.sh`'s existence.
          key: ${{ runner.os }}-esp-idf-${{ env.IDF_VERSION }}-esp32-esp32s3-esp32p4-v2
          # This item is very expensive to fetch, so try to always keep it cached.
          # Caveat: save-always: true means a partially-failed install can be
          # cached. `export.sh` exists as soon as the clone does, so checking for
          # it proves nothing — the "Verify the ESP-IDF Python env" step below is
          # what actually validates the cache (and repairs it by re-running the
          # idempotent install script). If you ever get a mysteriously broken
          # cache, bump the key suffix above; actions/cache also has a UI to
          # delete entries by key.
          save-always: true

      - name: Install libusb
        if: steps.cache-idf.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libusb-1.0-0

      - name: Install ESP-IDF toolchain
        if: steps.cache-idf.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/esp"
          if [ -d "$HOME/esp/esp-idf" ] && [ ! -f "$HOME/esp/esp-idf/export.sh" ]; then
            rm -rf "$HOME/esp/esp-idf"
          fi
          git clone --branch "${IDF_VERSION}" --single-branch \
            https://github.com/espressif/esp-idf.git "$HOME/esp/esp-idf"
          cd "$HOME/esp/esp-idf"
          # Install all required architectures: most boards are esp32s3,
          # esp32_2432s028rv3 / esp32_2432s024 (CYD) are classic esp32, and
          # elecrow_p4_lcd_7 uses esp32p4.
          ./install.sh esp32,esp32s3,esp32p4
          # `export.sh` ships with the clone, so its presence proves nothing;
          # prove the python env actually works. (The verify step below
          # re-checks this on every run and repairs a stale cache.)
          ( source ./export.sh && idf.py --version )

      # The cache stores both the toolchains AND the ESP-IDF Python venv
      # (~/.espressif/python_env/idf*_py*_env). A venv saved by a run whose
      # `install.sh` failed partway is missing packages that `idf.py` imports —
      # notably `rich` in ESP-IDF 6 — and every `export.sh` call then dies with
      # "Unable to import the rich module", which surfaces in the build jobs as
      # `idf.py: command not found`. `export.sh` existing does not prove the env
      # is usable (it ships with the git clone), so validate the thing we
      # actually need and repair by re-running the idempotent install script.
      # Runs on cache hits *and* misses so the repaired env is what gets saved.
      - name: Verify the ESP-IDF Python env (repair a stale cache)
        run: |
          set -o pipefail
          idf_dir="$HOME/esp/esp-idf"
          if [ ! -d "$idf_dir" ]; then
            echo "error: $idf_dir is missing — the toolchain cache did not restore" >&2
            exit 1
          fi
          cd "$idf_dir"
          if ( source ./export.sh >/dev/null 2>&1 && idf.py --version >/dev/null 2>&1 ); then
            echo "ESP-IDF python env OK"
          else
            echo "::warning::ESP-IDF python env incomplete (missing python packages) - re-running ./install.sh"
            ./install.sh esp32,esp32s3,esp32p4
            ( source ./export.sh && idf.py --version )
          fi

  # ---------------------------------------------------------------------------
  # build-firmware: matrix over all supported boards.  Runs in parallel once
  # install-esp-idf has populated the cache.  Each cell restores the toolchain
  # from cache (fast), configures and builds the firmware, then merges
  # bootloader + partition-table + app into a single flashable `<board>.bin`
  # uploaded as the `firmware-<board>` artifact.
  # ---------------------------------------------------------------------------
  build-firmware:
    needs: install-esp-idf
    name: Build firmware (${{ matrix.board }})
    strategy:
      fail-fast: false
      matrix:
        board:
          - jc4827w543
          - jc4827w543r
          - waveshare_s3_lcd_7b
          - esp32_2432s028rv3
          - elecrow_p4_lcd_7
          - elecrow_s3_lcd_7
          - elecrow_s3_lcd_7_adv
          - squixl
          - matouch_43
          - esp32_s3_devkitc_1
          - esp32_s3_matrix
    runs-on: ubuntu-latest
    env:
      IDF_VERSION: ${{ needs.install-esp-idf.outputs.idf-version }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up shared Python/Poetry/just/proto tooling
        uses: ./.github/actions/setup-python-poetry-just-proto

      - name: Restore ESP-IDF toolchain from cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.espressif
            ~/esp/esp-idf
          key: ${{ runner.os }}-esp-idf-${{ env.IDF_VERSION }}-esp32-esp32s3-esp32p4-v2

      # Must match the verification step in `install-esp-idf` (keep the two in
      # sync): a cached ESP-IDF venv can be missing python packages (e.g.
      # `rich`, which ESP-IDF 6's idf.py imports), and cells run in parallel
      # with — possibly before — the repaired cache is re-saved, so each one
      # self-checks and repairs instead of assuming the cache is healthy.
      - name: Verify the ESP-IDF Python env (repair a stale cache)
        run: |
          set -o pipefail
          idf_dir="$HOME/esp/esp-idf"
          if [ ! -d "$idf_dir" ]; then
            echo "error: $idf_dir is missing — the toolchain cache did not restore" >&2
            exit 1
          fi
          cd "$idf_dir"
          if ( source ./export.sh >/dev/null 2>&1 && idf.py --version >/dev/null 2>&1 ); then
            echo "ESP-IDF python env OK"
          else
            echo "::warning::ESP-IDF python env incomplete (missing python packages) - re-running ./install.sh"
            ./install.sh esp32,esp32s3,esp32p4
            ( source ./export.sh && idf.py --version )
          fi

      - name: Install libusb
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libusb-1.0-0

      - name: Configure and build firmware
        working-directory: ${{ github.workspace }}
        env:
          BOARD: ${{ matrix.board }}
        run: |
          SYS_PYTHON="$(command -v python3)"
          export SYS_PYTHON
          just build-proto-c
          just firmware-reconfigure "${BOARD}"
          just firmware-build

      - name: Merge firmware into a single flashable binary
        env:
          BOARD: ${{ matrix.board }}
        run: |
          source "$HOME/esp/esp-idf/export.sh"
          # Derive --chip from the generated sdkconfig.json so this works for
          # every board (esp32, esp32s3, esp32p4) without an explicit lookup
          # table. ESP-IDF writes this file to build/config/ after configure.
          chip="$(python3 -c "import json,sys; print(json.load(open('firmware/build/config/sdkconfig.json'))['IDF_TARGET'])")"
          if [ -z "${chip}" ]; then
            echo "error: could not read IDF_TARGET from firmware/build/config/sdkconfig.json" >&2
            exit 1
          fi
          echo "merging for chip=${chip}"
          # Drive esptool directly so the merge step works even when the
          # IDF venv has a pending version drift. flash_args already has
          # bootloader/partition-table/app addr+file pairs in build/.
          cd firmware/build
          # Flatten flash_args (flags line + addr/file lines) into argv.
          mapfile -t flash_args < flash_args
          args=()
          for line in "${flash_args[@]}"; do
            read -ra words <<< "$line"
            args+=("${words[@]}")
          done
          esptool --chip "${chip}" merge-bin -o "${GITHUB_WORKSPACE}/${BOARD}.bin" "${args[@]}"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.board }}
          path: ${{ matrix.board }}.bin
          if-no-files-found: error
