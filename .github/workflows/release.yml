name: Release

# Triggered when a GitHub release is published via the UI.
# Runs tests, builds firmware for all boards, publishes the Python package to
# PyPI and the Rust crate to crates.io, and uploads firmware binaries as
# release assets.
on:
  release:
    types: [published]

# Least privilege: read-only by default. Only the publish jobs and the
# release-asset upload widen it, via job-level `permissions:` blocks that
# *replace* this one: `publish-pypi` (OIDC trusted publishing + attestations),
# `publish-crates-io` (OIDC for crates.io trusted publishing) and
# `upload-release-assets` (release assets).
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # test-app: lint + test + build the Python package.
  # PyPI publish and release asset upload both depend on this passing.
  # ---------------------------------------------------------------------------
  test-app:
    name: Test & build Python package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6

      - name: Set up shared Python/Poetry/just/proto tooling
        uses: ./.github/actions/setup-python-poetry-just-proto
        with:
          install-app-deps: 'true'

      - name: Ruff lint
        run: poetry run ruff check src tests

      - name: Pytest
        run: poetry run pytest --cov=touchy_pad --cov-report=term-missing

      - name: Build wheel + sdist
        run: poetry build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: app/dist/

  # ---------------------------------------------------------------------------
  # test-rust: test the touchy-pad crate and prove the checked-in prost
  # bindings are still fresh. Shared with app-ci.yml via the reusable workflow,
  # so the gate guarding `publish-crates-io` below is the very same one that
  # runs on every PR.
  # ---------------------------------------------------------------------------
  test-rust:
    uses: ./.github/workflows/test-rust.yml

  # ---------------------------------------------------------------------------
  # build-firmware: cross-build firmware for every supported board and upload
  # a single merged flashable `<board>.bin` per board. Shared with app-ci.yml
  # via the reusable workflow so the matrix, IDF version, and merge command
  # only live in one place.
  # ---------------------------------------------------------------------------
  build-firmware:
    uses: ./.github/workflows/build-firmware.yml

  # ---------------------------------------------------------------------------
  # build-opendeck: cross-build the OpenDeck plugin for every target in the
  # manifest and package the multi-platform .sdPlugin zip. Shared with
  # app-ci.yml via the reusable workflow.
  # ---------------------------------------------------------------------------
  build-opendeck:
    uses: ./.github/workflows/build-opendeck.yml

  # ---------------------------------------------------------------------------
  # publish-pypi: OIDC trusted publish — only runs after tests pass.
  # ---------------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    needs: [test-app]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/touchy-pad
    # `contents: read` is required by actions/attest-build-provenance,
    # `id-token: write` by both it and pypa/gh-action-pypi-publish.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true

  # ---------------------------------------------------------------------------
  # publish-crates-io: publish the `touchy-pad` crate to crates.io.
  #
  # `cargo publish` needs neither `protoc` nor a build script here — the prost
  # bindings are checked in (Stage lb22).
  #
  # Auth: crates.io **trusted publishing** (GitHub OIDC) first — `touchy-pad`
  # reports `trustpub_only` on crates.io, so token publishing is not accepted for
  # it, and a short-lived OIDC token needs no long-lived credential. If no trusted
  # publisher is configured the auth step fails softly and the job falls back to
  # the `CARGO_REGISTRY_TOKEN` repository secret (the path that published 0.3.9,
  # the crate's first release).
  #
  # Setup steps for both paths: docs/plans/crates-io-publishing.md.
  # ---------------------------------------------------------------------------
  publish-crates-io:
    name: Publish to crates.io
    needs: [test-rust]
    runs-on: ubuntu-latest
    environment: cratesio  # Optional: for enhanced security
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Read the crate version and check crates.io
        id: version
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          # crates.io 404s for a crate/version that is not published, which makes
          # re-running a release (or publishing by hand first) harmless.
          if curl -sf -A "touchy-pad release workflow (${GITHUB_REPOSITORY})" \
               "https://crates.io/api/v1/crates/touchy-pad/${ver}" > /dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::touchy-pad ${ver} is already on crates.io — skipping publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "touchy-pad ${ver} is not on crates.io yet — it will be published"
          fi

      # Trusted publishing first (see the job comment): `continue-on-error` so an
      # un-configured trusted publisher degrades to the token secret below rather
      # than failing the whole release.
      - name: Authenticate with crates.io (trusted publishing)
        id: crates-io-auth
        if: steps.version.outputs.published == 'false'
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish touchy-pad
        if: steps.version.outputs.published == 'false'
        env:
          # The short-lived OIDC token when trusted publishing worked, otherwise
          # the repository secret (empty if neither is available — cargo then
          # fails with an explicit "no token found" error).
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --manifest-path rust/touchy-pad/Cargo.toml

  # ---------------------------------------------------------------------------
  # upload-release-assets: attach all firmware .bin files to the GitHub release.
  # Runs after all board builds succeed.
  # ---------------------------------------------------------------------------
  upload-release-assets:
    name: Upload firmware to GitHub Release
    needs: [build-firmware, build-opendeck, test-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: firmware-*
          merge-multiple: true
          path: firmware-dist/

      - name: Download plugin artifact
        uses: actions/download-artifact@v7
        with:
          name: opendeck-touchypad-plugin
          path: firmware-dist/

      - name: List firmware files
        run: ls -lh firmware-dist/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware-dist/*.bin
            firmware-dist/*.zip
